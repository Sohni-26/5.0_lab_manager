services:
  postgres:
    image: postgres:16-alpine
    container_name: campuslab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campuslab
      POSTGRES_PASSWORD: campuslab_dev_password
      POSTGRES_DB: campuslab
    ports:
      - "5432:5432"
    volumes:
      - campuslab_pgdata:/var/lib/postgresql/data

volumes:
  campuslab_pgdata:
